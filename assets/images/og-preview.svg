<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo Principal -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Grade de fundo sutil -->
  <path d="M 0 100 H 1200 M 0 200 H 1200 M 0 300 H 1200 M 0 400 H 1200 M 0 500 H 1200" stroke="#334155" stroke-width="1" stroke-opacity="0.15" />
  <path d="M 200 0 V 630 M 400 0 V 630 M 600 0 V 630 M 800 0 V 630 M 1000 0 V 630" stroke="#334155" stroke-width="1" stroke-opacity="0.15" />

  <!-- Brilhos ambientes -->
  <circle cx="200" cy="150" r="280" fill="#0284c7" opacity="0.12" filter="blur(60px)" />
  <circle cx="1000" cy="450" r="260" fill="#2563eb" opacity="0.10" filter="blur(60px)" />

  <!-- LADO ESQUERDO: Marca e Proposta de Valor -->
  <g transform="translate(80, 80)">
    <!-- Badge de Versão e Offline -->
    <rect width="250" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <text x="36" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">
      100% LOCAL &amp; OFFLINE • PWA
    </text>

    <!-- Título Principal -->
    <text x="0" y="90" font-family="system-ui, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="-1">
      STAMP<tspan fill="#38bdf8">-CAMERA</tspan>
    </text>

    <!-- Subtítulo -->
    <text x="0" y="130" font-family="system-ui, sans-serif" font-weight="500" font-size="21" fill="#94a3b8">
      Carimbo Técnico e Geográfico para Fotografias
    </text>

    <!-- Descrição Comercial / Pericial -->
    <text x="0" y="185" font-family="system-ui, sans-serif" font-size="16" fill="#cbd5e1" line-height="24">
      <tspan x="0" dy="0">Autenticação fotográfica para Perícias Judiciais, Vistorias,</tspan>
      <tspan x="0" dy="26">Fiscalizações e Obras. Extração automática de metadados</tspan>
      <tspan x="0" dy="26">EXIF, GPS, Data/Hora e reinjeção de integridade APP1.</tspan>
    </text>

    <!-- Tags Técnicas -->
    <g transform="translate(0, 290)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="65" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Sem Servidores</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="212" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Preserva EXIF</text>

      <!-- Tag 3 -->
      <rect x="294" y="0" width="150" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="369" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Lote ZIP &amp; Export</text>
    </g>

    <!-- Rodapé da Marca -->
    <text x="0" y="380" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
      Código Aberto sob Licença MIT • github.com/mathmorato/stamp-camera
    </text>
  </g>

  <!-- LADO DIREITO: Mockup de Imagem com Carimbo Técnico -->
  <g transform="translate(680, 80)" filter="url(#shadow)">
    <!-- Moldura da Fotografia -->
    <rect width="440" height="470" rx="16" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <rect x="12" y="12" width="416" height="446" rx="10" fill="#090d16" />

    <!-- Simulação da Foto de Fundo (Cena Urbana / Engenharia) -->
    <path d="M 20 320 L 140 220 L 260 290 L 380 180 L 420 220 L 420 440 L 20 440 Z" fill="#1e293b" opacity="0.6" />
    <circle cx="360" cy="80" r="32" fill="#38bdf8" opacity="0.2" />

    <!-- O Carimbo Técnico (Stamp) no Canto Inferior Esquerdo -->
    <g transform="translate(30, 270)">
      <!-- Fundo do Carimbo com Borda Ciano -->
      <rect width="380" height="170" rx="8" fill="#000000" fill-opacity="0.82" stroke="#38bdf8" stroke-width="2" />

      <!-- Linhas Técnicas do Carimbo -->
      <!-- Linha 1: Data e Hora -->
      <text x="16" y="32" font-family="monospace" font-size="13" font-weight="700" fill="#f8fafc">
        📅 22/11/2022 18:05:43 <tspan fill="#38bdf8" font-size="10">[EXIF]</tspan>
      </text>

      <!-- Linha 2: Coordenadas -->
      <text x="16" y="60" font-family="monospace" font-size="13" font-weight="700" fill="#f8fafc">
        📍 15°52'11.89"S, 50°51'08.19"W <tspan fill="#38bdf8" font-size="10">[EXIF]</tspan>
      </text>

      <!-- Linha 3: Localidade -->
      <text x="16" y="88" font-family="monospace" font-size="13" font-weight="700" fill="#f8fafc">
        🏙️ Jussara, Goiás, Brasil
      </text>

      <!-- Linha 4: Endereço & Bairro -->
      <text x="16" y="116" font-family="monospace" font-size="13" font-weight="700" fill="#f8fafc">
        🏠 Av. Principal, Centro
      </text>

      <!-- Linha 5: Metadados Técnicos / Processo -->
      <text x="16" y="144" font-family="monospace" font-size="12" font-weight="600" fill="#94a3b8">
        ⚖️ Proc: 004821/2026 • Resp: Eng. Matheus Morato
      </text>
    </g>
  </g>
</svg>
